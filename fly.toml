# fly.toml app configuration file
# See https://fly.io/docs/reference/configuration/ for information

app = "video-to-mp3-converter"
primary_region = "iad"  # Change to your preferred region

[build]
  dockerfile = "Dockerfile.fly"

[env]
  DEBUG = "False"
  PYTHONUNBUFFERED = "1"
  AUDIO_QUALITY = "192"
  AUDIO_FORMAT = "mp3"
  MAX_VIDEO_DURATION = "600"
  FILE_CLEANUP_AFTER = "3600"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

[mounts]
  source = "media_files"
  destination = "/code/media"
  initial_size = "10gb"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["web"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    restart_limit = 0

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/health/"
    protocol = "http"
    restart_limit = 0