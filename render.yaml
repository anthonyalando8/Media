services:
  - type: redis
    name: video-converter-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: video-converter-web
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: REDIS_URL
        fromService:
          name: video-converter-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: video-converter-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: video-converter-redis
          type: redis
          property: connectionString
      - key: MAX_VIDEO_DURATION
        value: "600"
      - key: AUDIO_QUALITY
        value: "192"
      - key: AUDIO_FORMAT
        value: "mp3"
      - key: FILE_CLEANUP_AFTER
        value: "1800"
      - key: PORT
        value: "10000"