<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Converter - Multi-Format</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 650px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="url"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Video Info Card */
        .video-info {
            display: none;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .video-info.active {
            display: block;
        }

        .video-info h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
            word-wrap: break-word;
        }

        .video-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        /* Format Selection */
        .format-selector {
            display: none;
        }

        .format-selector.active {
            display: block;
        }

        .format-section {
            margin-bottom: 20px;
        }

        .format-section h4 {
            color: #555;
            margin-bottom: 12px;
            font-size: 1em;
        }

        .format-option {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .format-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .format-option.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .format-option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .format-details {
            flex: 1;
            min-width: 0;
        }

        .format-label {
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .format-badge {
            font-size: 0.85em;
            padding: 2px 8px;
            border-radius: 4px;
            background: #667eea;
            color: white;
            white-space: nowrap;
        }

        .format-description {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
            word-wrap: break-word;
        }

        /* Progress Section */
        .progress-container {
            display: none;
            margin-top: 30px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 10px;
        }

        .progress-text {
            color: #666;
            font-weight: 500;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress-percentage {
            color: #667eea;
            font-weight: 700;
            flex-shrink: 0;
        }

        .progress-bar-wrapper {
            background: #f0f0f0;
            border-radius: 10px;
            height: 35px;
            overflow: hidden;
            margin-bottom: 10px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.5s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            position: relative;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { 
                transform: translateX(-100%);
            }
            100% { 
                transform: translateX(100%);
            }
        }

        .stage-indicator {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.8em;
            gap: 5px;
        }

        .stage {
            flex: 1;
            text-align: center;
            color: #ccc;
            padding: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stage.active {
            color: #667eea;
            font-weight: 600;
        }

        .stage.completed {
            color: #28a745;
        }

        /* Error & Success */
        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            word-wrap: break-word;
        }

        .error.active {
            display: block;
        }

        .success {
            background: #efe;
            border: 2px solid #cfc;
            color: #363;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .success.active {
            display: block;
        }

        .success h3 {
            margin-bottom: 15px;
        }

        .filename {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #555;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .download-btn {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .download-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .convert-next-btn {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .convert-next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(-10px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .action-buttons {
                flex-direction: column;
            }

            .download-btn,
            .convert-next-btn {
                width: 100%;
            }

            .stage {
                font-size: 0.7em;
            }

            .format-label {
                font-size: 0.95em;
            }

            .format-badge {
                font-size: 0.75em;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 25px 15px;
            }

            .format-option {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Video Converter</h1>
        <p class="subtitle">Download videos in any format - Audio or Video</p>

        <!-- Error Message -->
        <div class="error" id="errorMessage">
            <div id="errorText"></div>
        </div>

        <!-- Step 1: URL Input -->
        <div id="urlInputSection">
            <form id="urlForm">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_url">Video URL</label>
                    {{ form.url }}
                </div>
                <button type="submit" class="btn" id="getInfoBtn">
                    Get Video Info
                </button>
            </form>
        </div>

        <!-- Step 2: Video Info & Format Selection -->
        <div class="video-info" id="videoInfo">
            <h3 id="videoTitle"></h3>
            <div class="video-meta">
                <span id="videoDuration"></span> • 
                <span id="videoUploader"></span>
            </div>

            <div class="format-selector active">
                <!-- Audio Formats -->
                <div class="format-section">
                    <h4>🎵 Audio Formats</h4>
                    <div id="audioFormats"></div>
                </div>

                <!-- Video Formats -->
                <div class="format-section" id="videoFormatsSection" style="display: none;">
                    <h4>🎥 Video Formats</h4>
                    <div id="videoFormats"></div>
                </div>
            </div>

            <button class="btn" id="downloadBtn" style="margin-top: 15px;">
                Download Selected Format
            </button>
        </div>

        <!-- Step 3: Progress -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-header">
                <span class="progress-text" id="progressText">Initializing...</span>
                <span class="progress-percentage" id="progressPercentage">0%</span>
            </div>
            <div class="progress-bar-wrapper">
                <div class="progress-bar" id="progressBar">
                    <span id="progressBarText"></span>
                </div>
            </div>
            <div class="stage-indicator">
                <div class="stage" id="stage-validate">Validate</div>
                <div class="stage" id="stage-download">Download</div>
                <div class="stage" id="stage-convert">Convert</div>
                <div class="stage" id="stage-complete">Complete</div>
            </div>
        </div>

        <!-- Step 4: Success -->
        <div class="success" id="successMessage">
            <h3>✅ Download Complete!</h3>
            <div class="filename" id="filenameDisplay"></div>
            <div class="action-buttons">
                <a href="#" id="downloadLink" class="download-btn" download>
                    📥 Download File
                </a>
                <button class="convert-next-btn" id="convertNextBtn">
                    🔄 Convert Next
                </button>
            </div>
        </div>
    </div>

    <script>
        // Elements
        const urlForm = document.getElementById('urlForm');
        const urlInputSection = document.getElementById('urlInputSection');
        const getInfoBtn = document.getElementById('getInfoBtn');
        const videoInfo = document.getElementById('videoInfo');
        const videoTitle = document.getElementById('videoTitle');
        const videoDuration = document.getElementById('videoDuration');
        const videoUploader = document.getElementById('videoUploader');
        const audioFormats = document.getElementById('audioFormats');
        const videoFormats = document.getElementById('videoFormats');
        const videoFormatsSection = document.getElementById('videoFormatsSection');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressBarText = document.getElementById('progressBarText');
        const progressText = document.getElementById('progressText');
        const progressPercentage = document.getElementById('progressPercentage');
        const successMessage = document.getElementById('successMessage');
        const downloadLink = document.getElementById('downloadLink');
        const filenameDisplay = document.getElementById('filenameDisplay');
        const convertNextBtn = document.getElementById('convertNextBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const urlInput = document.getElementById('id_url');

        // State
        let currentVideoData = null;
        let selectedFormat = 'mp3-192'; // Default
        let ws = null;

        // Helper Functions
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('active', 'fade-in');
        }

        function hideError() {
            errorMessage.classList.remove('active');
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function formatFileSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        }

        function updateProgress(percent, message, state) {
            percent = Math.min(100, Math.max(0, percent));
            progressBar.style.width = `${percent}%`;
            progressBarText.textContent = `${percent}%`;
            progressPercentage.textContent = `${percent}%`;
            progressText.textContent = message || 'Processing...';
            updateStageIndicators(state, percent);
        }

        function updateStageIndicators(state, percent) {
            const stages = ['validate', 'download', 'convert', 'complete'];
            stages.forEach(stage => {
                const el = document.getElementById(`stage-${stage}`);
                el.classList.remove('active', 'completed');
            });

            if (state === 'VALIDATING' || percent < 10) {
                document.getElementById('stage-validate').classList.add('active');
            } else if (state === 'DOWNLOADING' || (percent >= 10 && percent < 80)) {
                document.getElementById('stage-validate').classList.add('completed');
                document.getElementById('stage-download').classList.add('active');
            } else if (state === 'CONVERTING' || (percent >= 80 && percent < 100)) {
                document.getElementById('stage-validate').classList.add('completed');
                document.getElementById('stage-download').classList.add('completed');
                document.getElementById('stage-convert').classList.add('active');
            } else if (state === 'SUCCESS' || percent === 100) {
                stages.forEach(stage => {
                    document.getElementById(`stage-${stage}`).classList.add('completed');
                });
            }
        }

        // Step 1: Get Video Info
        urlForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const url = urlInput.value.trim();
            if (!url) {
                showError('Please enter a video URL');
                return;
            }

            getInfoBtn.disabled = true;
            getInfoBtn.innerHTML = '<span class="spinner"></span> Getting Info...';

            try {
                const response = await fetch('/api/video-info/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to get video info');
                }

                currentVideoData = data;
                displayVideoInfo(data);

            } catch (error) {
                showError(error.message);
                getInfoBtn.disabled = false;
                getInfoBtn.innerHTML = 'Get Video Info';
            }
        });

        // Display Video Info & Formats
        function displayVideoInfo(data) {
            videoTitle.textContent = data.title;
            videoDuration.textContent = data.duration_formatted || '';
            videoUploader.textContent = data.uploader || '';

            // Render audio formats
            audioFormats.innerHTML = '';
            data.formats.audio.forEach((fmt, index) => {
                const option = createFormatOption(fmt, index === 1); // Select mp3-192 by default
                audioFormats.appendChild(option);
            });

            // Render video formats (if any)
            if (data.formats.video && data.formats.video.length > 0) {
                videoFormatsSection.style.display = 'block';
                videoFormats.innerHTML = '';
                data.formats.video.forEach(fmt => {
                    const option = createFormatOption(fmt, false);
                    videoFormats.appendChild(option);
                });
            }

            // Show video info section
            urlInputSection.style.display = 'none';
            videoInfo.classList.add('active', 'fade-in');
            getInfoBtn.disabled = false;
            getInfoBtn.innerHTML = 'Get Video Info';
        }

        // Create Format Option Element
        function createFormatOption(format, isDefault) {
            const div = document.createElement('div');
            div.className = 'format-option' + (isDefault ? ' selected' : '');
            div.onclick = () => selectFormat(format.id, div);

            const sizeText = format.size_display ? ` • ${format.size_display}` : '';

            div.innerHTML = `
                <input type="radio" name="format" value="${format.id}" ${isDefault ? 'checked' : ''}>
                <div class="format-details">
                    <div class="format-label">
                        ${format.label}
                        <span class="format-badge">${format.speed_badge}</span>
                    </div>
                    <div class="format-description">
                        ${format.description}${sizeText} • ${format.conversion_time}
                    </div>
                </div>
            `;

            if (isDefault) {
                selectedFormat = format.id;
            }

            return div;
        }

        // Select Format
        function selectFormat(formatId, element) {
            selectedFormat = formatId;
            document.querySelectorAll('.format-option').forEach(el => {
                el.classList.remove('selected');
            });
            element.classList.add('selected');
            element.querySelector('input').checked = true;
        }

        // Step 2: Start Download
        downloadBtn.addEventListener('click', async () => {
            hideError();
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<span class="spinner"></span> Starting...';

            try {
                const response = await fetch('/api/convert/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({
                        url: currentVideoData.url,
                        format: selectedFormat,
                        title: currentVideoData.title
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Conversion failed');
                }

                // Hide video info, show progress
                videoInfo.classList.remove('active');
                progressContainer.classList.add('active', 'fade-in');
                updateProgress(0, 'Starting...', 'VALIDATING');

                // Connect WebSocket
                connectWebSocket(data.task_id);

            } catch (error) {
                showError(error.message);
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = 'Download Selected Format';
            }
        });

        // WebSocket Connection
        function connectWebSocket(taskId) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/progress/${taskId}/`;

            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateProgress(data.percent || 0, data.message, data.state);

                if (data.state === 'SUCCESS') {
                    setTimeout(() => {
                        progressContainer.classList.remove('active');
                        successMessage.classList.add('active', 'fade-in');

                        const filename = data.filename;
                        downloadLink.href = `/media/${filename}`;
                        downloadLink.download = filename;

                        let fileInfo = `📄 ${filename}`;
                        if (data.file_size) {
                            fileInfo += ` (${formatFileSize(data.file_size)})`;
                        }
                        filenameDisplay.textContent = fileInfo;

                        downloadBtn.disabled = false;
                        downloadBtn.innerHTML = 'Download Selected Format';
                    }, 500);
                }

                if (data.state === 'FAILURE') {
                    showError(data.message || 'Conversion failed');
                    progressContainer.classList.remove('active');
                    videoInfo.classList.add('active');
                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = 'Download Selected Format';
                }
            };

            ws.onerror = () => {
                showError('Connection error. Please try again.');
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = 'Download Selected Format';
            };
        }

        // Reset Form
        function resetForm() {
            urlInput.value = '';
            currentVideoData = null;
            selectedFormat = 'mp3-192';
            hideError();
            
            urlInputSection.style.display = 'block';
            videoInfo.classList.remove('active');
            progressContainer.classList.remove('active');
            successMessage.classList.remove('active');
            
            if (ws) {
                ws.close();
                ws = null;
            }
            
            urlInput.focus();
        }

        convertNextBtn.addEventListener('click', resetForm);
        urlInput.focus();
    </script>
</body>
</html>
